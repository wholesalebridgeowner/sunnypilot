name: Ram pinned lane sequence observational regression
on:
  push:
    branches: [ram1500-lane-sequence-continuity-20261120]
    paths:
      - 'ram1500-development/ramtools/lane_maneuver_sequences.py'
      - 'ram1500-development/tests/test_lane_maneuver_sequences.py'
      - 'ram1500-development/ramtools/lane_phase_quality.py'
      - '.github/workflows/ram-lane-sequence-tests.yml'
  pull_request:
    paths:
      - 'ram1500-development/ramtools/lane_maneuver_sequences.py'
      - 'ram1500-development/tests/test_lane_maneuver_sequences.py'
      - 'ram1500-development/ramtools/lane_phase_quality.py'
      - '.github/workflows/ram-lane-sequence-tests.yml'
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Joined model-phase synthetic regression
        run: cd ram1500-development && python -m pytest tests/test_lane_maneuver_sequences.py tests/test_lane_phase_quality.py -q
      - name: Compile read-only observational source
        run: python -m compileall -q ram1500-development/ramtools/lane_maneuver_sequences.py
