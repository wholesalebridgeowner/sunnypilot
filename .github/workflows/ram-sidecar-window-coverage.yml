name: Ram sidecar complete-window CPU evidence tests
on:
  push:
    branches: [ram1500-sidecar-health-coverage-20261118]
    paths:
      - 'ram1500-development/sidecar_health_gate.py'
      - 'ram1500-development/test_sidecar_health_gate.py'
      - 'ram1500-development/reports/2026-11-18-sidecar-complete-window-validation.md'
      - '.github/workflows/ram-sidecar-window-coverage.yml'
  pull_request:
    paths:
      - 'ram1500-development/sidecar_health_gate.py'
      - 'ram1500-development/test_sidecar_health_gate.py'
      - '.github/workflows/ram-sidecar-window-coverage.yml'
permissions:
  contents: read
jobs:
  offline-resource-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test complete parked resource evidence and privacy
        run: python -m unittest discover -s ram1500-development -p 'test_sidecar_health_gate.py' -v
