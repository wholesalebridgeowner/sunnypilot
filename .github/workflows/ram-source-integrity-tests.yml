name: Ram recorded build exact-source integrity tests
on:
  push:
    branches:
      - ram1500-recorded-source-exact-gate-20261118
    paths:
      - 'ram1500-development/private_full_route_cruise_audit.py'
      - 'ram1500-development/ramtools/recorded_source_integrity.py'
      - 'ram1500-development/tests/test_recorded_source_integrity.py'
      - 'ram1500-development/tests/test_full_route_cruise_audit.py'
      - 'ram1500-development/Dockerfile.comfort'
      - '.github/workflows/ram-source-integrity-tests.yml'
  pull_request:
    paths:
      - 'ram1500-development/private_full_route_cruise_audit.py'
      - 'ram1500-development/ramtools/recorded_source_integrity.py'
      - 'ram1500-development/tests/test_recorded_source_integrity.py'
      - 'ram1500-development/tests/test_full_route_cruise_audit.py'
      - 'ram1500-development/Dockerfile.comfort'
      - '.github/workflows/ram-source-integrity-tests.yml'
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.3.4
      - name: Full recorded-build pin regression (strict 40-hex)
        run: cd ram1500-development && python -m pytest -q tests/test_recorded_source_integrity.py tests/test_full_route_cruise_audit.py
