name: Ram comfort per-segment exact-source integrity
on:
  push:
    branches:
      - ram1500-comfort-segment-source-gate-20261119
    paths:
      - 'ram1500-development/private_comfort_rlog_probe.py'
      - 'ram1500-development/tests/test_private_comfort_rlog_probe.py'
      - 'ram1500-development/ramtools/recorded_source_integrity.py'
      - '.github/workflows/ram-comfort-exact-source.yml'
  pull_request:
    paths:
      - 'ram1500-development/private_comfort_rlog_probe.py'
      - 'ram1500-development/tests/test_private_comfort_rlog_probe.py'
      - 'ram1500-development/ramtools/recorded_source_integrity.py'
      - '.github/workflows/ram-comfort-exact-source.yml'
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.3.4
      - name: Anonymous comfort source and per-segment fixtures
        run: cd ram1500-development && python -m pytest -q tests/test_private_comfort_rlog_probe.py tests/test_recorded_source_integrity.py
