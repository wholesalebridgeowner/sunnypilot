name: Ram parked sidecar representative-load evidence tests
on:
  push:
    branches: [ram1500-sidecar-rate-integrity-20261118]
    paths:
      - 'ram1500-development/sidecar_health_gate.py'
      - 'ram1500-development/test_sidecar_health_gate.py'
      - 'ram1500-development/reports/2026-11-18-sidecar-representative-load-gates.md'
      - '.github/workflows/ram-sidecar-rate-integrity.yml'
  pull_request:
    paths:
      - 'ram1500-development/sidecar_health_gate.py'
      - 'ram1500-development/test_sidecar_health_gate.py'
      - '.github/workflows/ram-sidecar-rate-integrity.yml'
permissions:
  contents: read
jobs:
  synthetic-offline-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify CPU-window and representative carState-rate gates
        run: python -m unittest discover -s ram1500-development -p 'test_sidecar_health_gate.py' -v
