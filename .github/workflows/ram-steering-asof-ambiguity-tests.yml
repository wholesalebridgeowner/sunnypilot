name: Ram steering as-of source ambiguity regression
on:
  push:
    branches:
      - ram1500-asof-ambiguity-gate-20261119
    paths:
      - 'ram1500-development/ramtools/lateral_stability_observer.py'
      - 'ram1500-development/tests/test_lateral_stability_observer.py'
      - 'ram1500-development/reports/2026-11-19-steering-asof-source-integrity.md'
      - '.github/workflows/ram-steering-asof-ambiguity-tests.yml'
  pull_request:
    paths:
      - 'ram1500-development/ramtools/lateral_stability_observer.py'
      - 'ram1500-development/tests/test_lateral_stability_observer.py'
      - 'ram1500-development/reports/2026-11-19-steering-asof-source-integrity.md'
      - '.github/workflows/ram-steering-asof-ambiguity-tests.yml'
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.3.4
      - name: Verify read-only observer source disambiguation
        run: cd ram1500-development && python -m pytest -q tests/test_lateral_stability_observer.py
