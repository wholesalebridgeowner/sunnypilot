name: Ram pinned comfort fixture tests
on:
  push:
    branches: [ram1500-pinned-comfort-20261117]
    paths:
      - 'ram1500-development/**'
      - '.github/workflows/ram-pinned-comfort-tests.yml'
  pull_request:
    paths:
      - 'ram1500-development/**'
      - '.github/workflows/ram-pinned-comfort-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Pinned decoder comfort fixtures
        run: cd ram1500-development && python -m pytest tests/test_comfort.py tests/test_comfort_episodes.py tests/test_lane_phase_quality.py tests/test_torque_cap.py tests/test_park_replication.py tests/test_parameter_proposal.py tests/test_parameter_experiments.py -q
      - name: Verify offline parameter candidate manifest
        run: cd ram1500-development && python -m ramtools.parameter_proposal proposed_parameters.json
      - name: Generate non-installable actuator delay sensitivity experiments
        run: cd ram1500-development && python -m ramtools.parameter_experiments proposed_parameters.json > /dev/null
