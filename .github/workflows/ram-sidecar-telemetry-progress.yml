name: Ram parked sidecar telemetry-progress evidence tests
on:
  push:
    branches: [ram1500-sidecar-telemetry-progress-20261118]
    paths:
      - 'ram1500-development/sidecar_health_gate.py'
      - 'ram1500-development/test_sidecar_health_gate.py'
      - 'ram1500-development/reports/2026-11-18-sidecar-telemetry-continuity.md'
      - '.github/workflows/ram-sidecar-telemetry-progress.yml'
  pull_request:
    paths:
      - 'ram1500-development/sidecar_health_gate.py'
      - 'ram1500-development/test_sidecar_health_gate.py'
      - '.github/workflows/ram-sidecar-telemetry-progress.yml'
permissions:
  contents: read
jobs:
  offline-telemetry-continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify parked sidecar resource and data-liveness integrity
        run: python -m unittest discover -s ram1500-development -p 'test_sidecar_health_gate.py' -v
