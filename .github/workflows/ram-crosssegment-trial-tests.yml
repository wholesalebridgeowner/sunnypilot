name: Ram cross-segment read-only ordering tests
on:
  push:
    branches: [ram1500-crosssegment-readonly-pilot]
    paths:
      - 'ram1500-development/auto_review_crosssegment_order.py'
      - 'ram1500-development/test_auto_review_crosssegment_order.py'
      - '.github/workflows/ram-crosssegment-trial-tests.yml'
  pull_request:
    paths:
      - 'ram1500-development/auto_review_crosssegment_order.py'
      - 'ram1500-development/test_auto_review_crosssegment_order.py'
      - '.github/workflows/ram-crosssegment-trial-tests.yml'
jobs:
  cross-segment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bounded stream and privacy fixture tests
        run: python3 -m unittest discover -s ram1500-development -p 'test_auto_review_crosssegment_order.py' -v
