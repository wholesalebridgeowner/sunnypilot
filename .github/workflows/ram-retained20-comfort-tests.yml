name: Ram retained morning 20-segment comfort integrity
on:
  push:
    branches:
      - ram1500-comfort-retained20-20261119
    paths:
      - 'ram1500-development/private_comfort_rlog_probe.py'
      - 'ram1500-development/tests/test_private_comfort_rlog_probe.py'
      - '.github/workflows/ram-retained20-comfort-tests.yml'
  pull_request:
    paths:
      - 'ram1500-development/private_comfort_rlog_probe.py'
      - 'ram1500-development/tests/test_private_comfort_rlog_probe.py'
      - '.github/workflows/ram-retained20-comfort-tests.yml'
jobs:
  offline-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact fixture test dependency
        run: python -m pip install pytest==8.3.4
      - name: Verify private summary and twenty-segment bounds, no raw data
        run: cd ram1500-development && python -m pytest -q tests/test_private_comfort_rlog_probe.py tests/test_comfort_episodes.py tests/test_acc_motion_integrity.py tests/test_lane_phase_quality.py tests/test_recorded_source_integrity.py
