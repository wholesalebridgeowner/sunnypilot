name: Ram parked-sidecar health evidence fixtures

on:
  push:
    branches: [ram1500-sidecar-health-independent-gate-20261118]
    paths:
      - 'ram1500-development/sidecar_health_gate.py'
      - 'ram1500-development/test_sidecar_health_gate.py'
      - 'ram1500-development/reports/2026-11-18-sidecar-health-evidence-gates.md'
      - '.github/workflows/ram-sidecar-health-evidence.yml'
  pull_request:
    paths:
      - 'ram1500-development/sidecar_health_gate.py'
      - 'ram1500-development/test_sidecar_health_gate.py'
      - 'ram1500-development/reports/2026-11-18-sidecar-health-evidence-gates.md'
      - '.github/workflows/ram-sidecar-health-evidence.yml'

permissions:
  contents: read

jobs:
  synthetic-health-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evaluate synthetic parked health sessions
        run: python -m unittest discover -s ram1500-development -p 'test_sidecar_health_gate.py' -v
