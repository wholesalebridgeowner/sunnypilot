name: Ram steering neutral-interval reversal integrity
on:
  push:
    branches:
      - ram1500-steering-neutral-contiguity-20261119
    paths:
      - 'ram1500-development/ramtools/lateral_stability_observer.py'
      - 'ram1500-development/tests/test_lateral_stability_observer.py'
      - 'ram1500-development/reports/2026-11-19-steering-neutral-dwell-integrity.md'
      - '.github/workflows/ram-steering-neutral-contiguity-tests.yml'
  pull_request:
    paths:
      - 'ram1500-development/ramtools/lateral_stability_observer.py'
      - 'ram1500-development/tests/test_lateral_stability_observer.py'
      - 'ram1500-development/reports/2026-11-19-steering-neutral-dwell-integrity.md'
      - '.github/workflows/ram-steering-neutral-contiguity-tests.yml'
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.3.4
      - name: Synthetic steering-neutral continuity regressions
        run: cd ram1500-development && python -m pytest -q tests/test_lateral_stability_observer.py
