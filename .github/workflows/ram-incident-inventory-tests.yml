name: Ram 8:19 PM incident route locator tests
on:
  push:
    branches: [ram1500-2019-steering-warning-probe]
    paths:
      - 'ram1500-development/incident_route_inventory.py'
      - 'ram1500-development/test_incident_route_inventory.py'
      - '.github/workflows/ram-incident-inventory-tests.yml'
jobs:
  route-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s ram1500-development -p 'test_incident_route_inventory.py' -v
