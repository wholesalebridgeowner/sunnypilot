name: Ram steering exposure integrity regressions
on:
  push:
    branches:
      - ram1500-stability-exposure-audit-20261118
    paths:
      - 'ram1500-development/ramtools/lateral_stability_observer.py'
      - 'ram1500-development/tests/test_lateral_stability_observer.py'
      - 'ram1500-development/reports/2026-11-18-steering-exposure-continuity-gate.md'
      - '.github/workflows/ram-stability-exposure-tests.yml'
  pull_request:
    paths:
      - 'ram1500-development/ramtools/lateral_stability_observer.py'
      - 'ram1500-development/tests/test_lateral_stability_observer.py'
      - 'ram1500-development/reports/2026-11-18-steering-exposure-continuity-gate.md'
      - '.github/workflows/ram-stability-exposure-tests.yml'
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.3.4
      - name: Steering reversal proxy continuity gates
        run: cd ram1500-development && python -m pytest -q tests/test_lateral_stability_observer.py
