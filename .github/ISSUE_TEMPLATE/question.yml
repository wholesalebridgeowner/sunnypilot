name: Question or correction
description: Ask about a finding, or point out something that looks wrong.
body:
  - type: markdown
    attributes:
      value: |
        **Please don't post your VIN, location, GPS traces, dongle ID or log files.**
  - type: input
    id: finding
    attributes:
      label: Which finding or report?
      placeholder: "Finding 3, steering in tight curves"
  - type: textarea
    id: details
    attributes:
      label: Your question or correction
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I haven't included my VIN, location, dongle ID or log files.
          required: true
